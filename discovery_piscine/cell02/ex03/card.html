<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile Card</title>
  <link rel="stylesheet" href="card.css">
</head>
<body>
  <main class="page">
    <h1>User Profile Card</h1>

    <article class="profile-card">
      <table class="profile-layout" role="presentation">
        <tbody>
          <tr>
            <td class="photo-cell">
              <figure class="photo-figure">
                <img
                  class="profile-picture"
                  src="https://commons.wikimedia.org/wiki/Special:FilePath/Kylian_Mbapp%C3%A9_2018.jpg?width=900"
                  alt="Kylian Mbappé with the France national team"
                >
              </figure>
            </td>
          </tr>
          <tr>
            <td class="name-cell">
              <h2>@Mackyz239</h2>
            </td>
          </tr>
          <tr>
            <td class="description-cell">
              <p>42 student</p>
            </td>
          </tr>
          <tr>
            <td class="social-cell">
              <nav class="social-links" aria-label="Social media">
                <a href="https://github.com/" aria-label="GitHub">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.56.1.76-.24.76-.54v-2.1c-3.1.67-3.76-1.32-3.76-1.32-.5-1.29-1.24-1.63-1.24-1.63-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15 1 .17 1.79-.75 2.22-1.18-.29-.04-.59-.14-.89-.3-2.54-.43-3.53-1.6-3.53-3.74 0-.9.32-1.63.84-2.19-.09-.22-.37-1.04.08-2.16 0 0 .69-.22 2.25.84a7.8 7.8 0 0 1 4.99 0c1.56-1.06 2.25-.84 2.25-.84.45 1.12.17 1.94.08 2.16.52.56.84 1.29.84 2.19 0 2.15-1 3.31-3.54 3.74-.37.2-.77.3-1.15.32v3.74c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z"/>
                  </svg>
                </a>
                <a href="https://www.instagram.com/" aria-label="Instagram">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
                    <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
                    <circle cx="17.7" cy="6.5" r="1.2" fill="currentColor"/>
                  </svg>
                </a>
                <a href="https://www.linkedin.com/" aria-label="LinkedIn">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M4.5 3.5a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM3 9h3v12H3zm5 0h2.9v1.6h.1A3.2 3.2 0 0 1 14 8.8c3.2 0 3.8 2.1 3.8 4.8V21h-3v-6.6c0-1.6 0-3.6-2.2-3.6s-2.6 1.7-2.6 3.5V21H8Z"/>
                  </svg>
                </a>
              </nav>
            </td>
          </tr>
          <tr>
            <td class="contact-cell">
              <a class="contact-button" href="mailto:hello@example.com">Contact</a>
            </td>
          </tr>
        </tbody>
      </table>
    </article>
  </main>
</body>
</html>
