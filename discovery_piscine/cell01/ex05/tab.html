<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tab</title>
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
    }

    td {
      width: 50%;
      height: 90px;
      border: 1px solid black;
    }

    .first-cell {
      background-color: #c2cc7a;
    }

    .second-cell {
      background-color: #f8c1ad;
    }
  </style>
</head>
<body>
  <table>
    <tr>
      <td class="first-cell">First cell</td>
      <td class="second-cell">Second cell</td>
    </tr>
  </table>
</body>
</html>
