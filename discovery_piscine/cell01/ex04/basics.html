<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basics</title>
  <style>
    body {
      background-color: pink;
    }

    h1 {
      color: white;
      text-align: center;
      font-size: 3em;
    }

    .shops {
      display: flex;
      justify-content: center;
      gap: 20px;
      text-align: center;
    }

    .shop img {
      width: 300px;
      height: 180px;
      object-fit: contain;
      background-color: white;
    }

    .shop a {
      display: block;
      margin-top: 10px;
    }

    hr {
      margin-top: 30px;
    }

    .copyright {
      text-align: right;
      font-family: monospace;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>Basics &hearts;</h1>

  <div class="shops">
    <div class="shop">
      <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon logo">
      <a href="https://www.amazon.com">Amazon</a>
    </div>
    <div class="shop">
      <img src="https://upload.wikimedia.org/wikipedia/commons/a/a6/Logo_NIKE.svg" alt="Nike logo">
      <a href="https://www.nike.com">Nike</a>
    </div>
  </div>

  <hr>
  <p class="copyright">© Mackyz23 2026</p>
</body>
</html>
